services:
  hasura:
    container_name: hasura
    image: hasura/graphql-engine:${HASURA_VERSION:-v2.50.3}
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${HASURA_CPUS_LIMIT:-0.5}"
          memory: "${HASURA_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${HASURA_CPUS_RESERVED:-0.1}"
          memory: "${HASURA_MEMORY_RESERVED:-128M}"
    # Host 8085 avoids Traefik dashboard on 8080 (container still listens on 8080)
    ports:
      - "127.0.0.1:${HASURA_PORT:-8085}:8080"
    environment:
      # Shared PostgreSQL 16 (postgres/docker-compose.yml) on infra_shared
      HASURA_GRAPHQL_METADATA_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Password102!}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-hasura}"
      PG_DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Password102!}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-hasura}"
      HASURA_GRAPHQL_ENABLE_CONSOLE: "${HASURA_GRAPHQL_ENABLE_CONSOLE:-true}"
      HASURA_GRAPHQL_DEV_MODE: "${HASURA_GRAPHQL_DEV_MODE:-true}"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: "${HASURA_GRAPHQL_ENABLED_LOG_TYPES:-startup, http-log, webhook-log, websocket-log,\
        \ query-log}"
      HASURA_GRAPHQL_ADMIN_SECRET: "${HASURA_GRAPHQL_ADMIN_SECRET:-Password102!}"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "${HASURA_GRAPHQL_UNAUTHORIZED_ROLE:-anonymous}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_shared"
      - "traefik.http.routers.hasura.rule=Host(`${HASURA_HOSTNAME:-hasura.dss.localhost}`)"
      - "traefik.http.routers.hasura.entrypoints=web,websecure"
      - "traefik.http.routers.hasura.tls=true"
      - "traefik.http.services.hasura.loadbalancer.server.port=8080"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
