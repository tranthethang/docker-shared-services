services:
  postgres:
    container_name: postgres
    image: postgres:16.15-alpine
    entrypoint: ["/bin/bash", "/usr/local/bin/dss-entrypoint.sh"]
    restart: "${RESTART_POLICY:-unless-stopped}"
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES16_CPUS_LIMIT:-1}"
          memory: "${POSTGRES16_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${POSTGRES16_CPUS_RESERVED:-0.5}"
          memory: "${POSTGRES16_MEMORY_RESERVED:-512M}"
    environment:
      POSTGRES_USER: "${POSTGRES16_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env — run make setup}"
      POSTGRES_DB: "${POSTGRES16_DB:-postgres_db}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "127.0.0.1:${POSTGRES16_PORT:-5432}:5432"
    networks:
      - backend_net
      - data_net
    volumes:
      - ./bin/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./bin/entrypoint.sh:/usr/local/bin/dss-entrypoint.sh:ro
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # pg_isready uses the local trust socket and stays green when scram rejects
    # the password clients actually send. Probe the container IP instead.
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$(hostname -i | awk '{print $$1}')\" -U \"$$POSTGRES_USER\"\
            \ -d postgres -tAc 'SELECT 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend_net:
    external: true
  data_net:
    external: true

volumes:
  postgres_data:
