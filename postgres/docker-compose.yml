services:
  postgres:
    container_name: postgres
    image: postgres:16.15-alpine
    restart: "${RESTART_POLICY:-unless-stopped}"
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES16_CPUS_LIMIT:-1}"
          memory: "${POSTGRES16_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${POSTGRES16_CPUS_RESERVED:-0.5}"
          memory: "${POSTGRES16_MEMORY_RESERVED:-512M}"
    environment:
      POSTGRES_USER: "${POSTGRES16_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES16_PASSWORD:-Password102!}"
      POSTGRES_DB: "${POSTGRES16_DB:-postgres_db}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "127.0.0.1:${POSTGRES16_PORT:-5432}:5432"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - ./bin:/usr/local/bin/postgres-scripts:ro
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - sh
      - -c
      - |
        (
          sleep 10
          until pg_isready -U "$${POSTGRES_USER:-postgres}" -q; do
            sleep 2
          done
          /usr/local/bin/postgres-scripts/init.sh
        ) &
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES16_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  postgres_data:
