services:
  pocketbase:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.pocketbase.rule=Host(`pocketbase.dss.localhost`)"
      - "traefik.http.routers.pocketbase.entrypoints=websecure"
      - "traefik.http.routers.pocketbase.tls=true"
      - "traefik.http.services.pocketbase.loadbalancer.server.port=8090"
    container_name: pocketbase
    image: "ghcr.io/muchobien/pocketbase:0.39.4"
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${POCKETBASE_CPUS_LIMIT:-0.25}"
          memory: "${POCKETBASE_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${POCKETBASE_CPUS_RESERVED:-0.05}"
          memory: "${POCKETBASE_MEMORY_RESERVED:-64M}"
    networks:
      - traefik_proxy
      - backend_net
    volumes:
      - pocketbase_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  pocketbase_data:
