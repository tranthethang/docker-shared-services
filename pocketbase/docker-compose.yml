services:
  pocketbase:
    container_name: pocketbase
    image: "ghcr.io/muchobien/pocketbase:latest"
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${POCKETBASE_CPUS_LIMIT:-0.25}"
          memory: "${POCKETBASE_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${POCKETBASE_CPUS_RESERVED:-0.05}"
          memory: "${POCKETBASE_MEMORY_RESERVED:-64M}"
    ports:
      - "${POCKETBASE_PORT:-8140}:8090"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - pocketbase_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
volumes:
  pocketbase_data:
