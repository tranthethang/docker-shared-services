services:
  mariadb:
    container_name: mariadb
    image: "mariadb:11.4.5"
    restart: "${RESTART_POLICY:-unless-stopped}"
    command: mariadbd --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          cpus: "${MARIADB_CPUS_LIMIT:-1}"
          memory: "${MARIADB_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MARIADB_CPUS_RESERVED:-0.5}"
          memory: "${MARIADB_MEMORY_RESERVED:-512M}"
    environment:
      MARIADB_DATABASE: "${MARIADB_DATABASE:-app}"
      MARIADB_USER: "${MARIADB_USER:-appuser}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env — run make setup}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env — run make setup}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    networks:
      - data_net
    volumes:
      - mariadb_data:/var/lib/mysql
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  data_net:
    external: true

volumes:
  mariadb_data:
