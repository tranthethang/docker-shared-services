services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    deploy:
      resources:
        limits:
          cpus: "${KAFKA_CPUS_LIMIT:-1}"
          memory: "${KAFKA_MEMORY_LIMIT:-1024M}"
        reservations:
          cpus: "${KAFKA_CPUS_RESERVED:-0.5}"
          memory: "${KAFKA_MEMORY_RESERVED:-512M}"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      CLUSTER_ID: "${CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 104857600 # 100MB
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - infra_shared
    restart: "${RESTART_POLICY:-always}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    deploy:
      resources:
        limits:
          cpus: "${KAFKA_UI_CPUS_LIMIT:-0.5}"
          memory: "${KAFKA_UI_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${KAFKA_UI_CPUS_RESERVED:-0.25}"
          memory: "${KAFKA_UI_MEMORY_RESERVED:-256M}"
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-kraft"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      JVM_OPTS: "-Xmx256M -Xms256M"
    depends_on:
      - kafka
    networks:
      - infra_shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kafka-ui.rule=Host(`kafka-ui.localhost`)"
      - "traefik.http.routers.kafka-ui.entrypoints=web,websecure"
      - "traefik.http.routers.kafka-ui.tls=true"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"
    restart: "${RESTART_POLICY:-always}"

volumes:
  kafka_data:
    name: kafka_data

networks:
  infra_shared:
    name: infra_shared
    external: true
