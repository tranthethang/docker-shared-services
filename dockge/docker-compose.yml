services:
  dockge:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dockge.rule=Host(`dockge.dss.localhost`)"
      - "traefik.http.routers.dockge.entrypoints=web,websecure"
      - "traefik.http.routers.dockge.tls=true"
      - "traefik.http.services.dockge.loadbalancer.server.port=5001"
    container_name: dockge
    image: louislam/dockge:1
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${DOCKGE_CPUS_LIMIT:-0.5}"
          memory: "${DOCKGE_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${DOCKGE_CPUS_RESERVED:-0.25}"
          memory: "${DOCKGE_MEMORY_RESERVED:-256M}"
    volumes:
      # RW required for Dockge stack management (SEC-01 intentionally not :ro).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - "${DOCKGE_STACKS_DIR:-./stacks}:/app/stacks"
    environment:
      - DOCKGE_STACKS_DIR=/app/stacks
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
