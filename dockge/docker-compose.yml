services:
  dockge:
    labels:
      - "traefik.enable=true"
      - "dss.stack=${DSS_NAME:-dss}"
      - "traefik.http.routers.dockge.rule=Host(`dockge.${DOMAIN:-sandbox.localhost}`)"
      - "traefik.http.routers.dockge.entrypoints=web"
      - "traefik.http.services.dockge.loadbalancer.server.port=5001"
    container_name: ${DSS_NAME:+${DSS_NAME}-}dockge
    image: louislam/dockge:1.5.0
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${DOCKGE_CPUS_LIMIT:-0.5}"
          memory: "${DOCKGE_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${DOCKGE_CPUS_RESERVED:-0.25}"
          memory: "${DOCKGE_MEMORY_RESERVED:-256M}"
    volumes:
      # RW required for Dockge stack management (SEC-01 intentionally not :ro).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - "${DOCKGE_STACKS_DIR:-./stacks}:/app/stacks"
    environment:
      - DOCKGE_STACKS_DIR=/app/stacks
    networks:
      - traefik_proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
