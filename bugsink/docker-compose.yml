services:
  bugsink:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_shared"
      - "traefik.http.routers.bugsink.rule=Host(`bugsink.localhost`)"
      - "traefik.http.routers.bugsink.entrypoints=web,websecure"
      - "traefik.http.routers.bugsink.tls=true"
      - "traefik.http.services.bugsink.loadbalancer.server.port=8000"
    container_name: bugsink
    image: bugsink/bugsink:2
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${BUGSINK_CPUS_LIMIT:-0.5}"
          memory: "${BUGSINK_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${BUGSINK_CPUS_RESERVED:-0.1}"
          memory: "${BUGSINK_MEMORY_RESERVED:-128M}"
    ports:
      - "${BUGSINK_PORT:-8150}:8000"
    environment:
      SECRET_KEY: "${BUGSINK_SECRET_KEY:-change-me-generate-with-openssl-rand-base64-50}"
      CREATE_SUPERUSER: "${BUGSINK_CREATE_SUPERUSER:-admin@example.org:admin}"
      PORT: 8000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password102}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-bugsink}"
      BEHIND_HTTPS_PROXY: "${BUGSINK_BEHIND_HTTPS_PROXY:-true}"
      USE_X_FORWARDED_HOST: "${BUGSINK_USE_X_FORWARDED_HOST:-true}"
      BASE_URL: "${BUGSINK_BASE_URL:-https://bugsink.localhost}"
      SITE_TITLE: "${BUGSINK_SITE_TITLE:-Bugsink}"
      TIME_ZONE: "${TZ:-Asia/Ho_Chi_Minh}"
      EMAIL_HOST: "${BUGSINK_EMAIL_HOST:-mailpit}"
      EMAIL_PORT: "${BUGSINK_EMAIL_PORT:-1025}"
      EMAIL_HOST_USER: "${BUGSINK_EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${BUGSINK_EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${BUGSINK_EMAIL_USE_TLS:-false}"
      EMAIL_USE_SSL: "${BUGSINK_EMAIL_USE_SSL:-false}"
      DEFAULT_FROM_EMAIL: "${BUGSINK_DEFAULT_FROM_EMAIL:-Bugsink <bugsink@localhost>}"
      EMAIL_LOGGING: "${BUGSINK_EMAIL_LOGGING:-true}"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD-SHELL", 'python -c ''import requests; requests.get("http://localhost:8000/health/ready").raise_for_status()''']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
