services:
  chromadb:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chromadb.rule=Host(`chromadb.localhost`)"
      - "traefik.http.routers.chromadb.entrypoints=web,websecure"
      - "traefik.http.routers.chromadb.tls=true"
      - "traefik.http.services.chromadb.loadbalancer.server.port=8000"
    container_name: chromadb
    image: chromadb/chroma:0.5.23
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${CHROMADB_CPUS_LIMIT:-1}"
          memory: "${CHROMADB_MEMORY_LIMIT:-2G}"
    volumes:
      - chromadb_data:/chroma/data
    ports:
      - "${CHROMADB_PORT:-8000}:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    networks:
      - infra_shared
      - dev_tools

volumes:
  chromadb_data:
    name: chromadb_data

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
