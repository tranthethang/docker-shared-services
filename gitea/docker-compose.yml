services:
  gitea:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.gitea.rule=Host(`gitea.dss.localhost`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    image: gitea/gitea:1.25.2
    container_name: gitea
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${GITEA_CPUS_LIMIT:-1}"
          memory: "${GITEA_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${GITEA_CPUS_RESERVED:-0.5}"
          memory: "${GITEA_MEMORY_RESERVED:-512M}"
    ports:
      - "127.0.0.1:${GITEA_SSH_PORT:-2222}:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=gitea.dss.localhost
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL:-https://gitea.dss.localhost/}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=${POSTGRES16_HOST:-postgres}:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${POSTGRES16_USER:-postgres}
      - GITEA__database__PASSWD=${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env — run make setup}
    volumes:
      - gitea_data:/data
    networks:
      - traefik_proxy
      - backend_net
      - data_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  data_net:
    external: true
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  gitea_data:
