services:
  gitea:
    image: gitea/gitea:1.25.2
    container_name: gitea
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${GITEA_CPUS_LIMIT:-1}"
          memory: "${GITEA_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${GITEA_CPUS_RESERVED:-0.5}"
          memory: "${GITEA_MEMORY_RESERVED:-512M}"
    ports:
      - "${GITEA_SSH_PORT:-2222}:22"
      - "${GITEA_HTTP_PORT:-3000}:3000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=pgvector:${POSTGRES_PORT:-5432}
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${POSTGRES_USER:-postgres}
      - GITEA__database__PASSWD=${POSTGRES_PASSWORD:-password102}
    volumes:
      - gitea_data:/data
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
volumes:
  gitea_data:
