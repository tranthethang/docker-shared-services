# Authelia — lightweight SSO / ForwardAuth for Traefik-protected UIs
# Portal: https://auth.dss.localhost  (cookie parent: dss.localhost)
# Protect a service under *.dss.localhost by adding:
#   traefik.http.routers.<name>.middlewares=authelia@docker
#
# Usage:
#   make up service=authelia
#   make up service=traefik  # required for the portal + ForwardAuth

services:
  authelia:
    container_name: authelia
    image: authelia/authelia:4.39.4
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${AUTHELIA_CPUS_LIMIT:-0.5}"
          memory: "${AUTHELIA_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${AUTHELIA_CPUS_RESERVED:-0.05}"
          memory: "${AUTHELIA_MEMORY_RESERVED:-64M}"
    volumes:
      - ./config:/config
    environment:
      TZ: "${TZ:-UTC}"
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "${AUTHELIA_JWT_SECRET}"
      AUTHELIA_SESSION_SECRET: "${AUTHELIA_SESSION_SECRET}"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "${AUTHELIA_STORAGE_ENCRYPTION_KEY}"
    ports:
      - "${AUTHELIA_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9091/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_shared"
      # Portal (must be under *.dss.localhost — see README / cookie domain notes)
      - "traefik.http.routers.authelia.rule=Host(`${AUTHELIA_HOSTNAME:-auth.dss.localhost}`)"
      - "traefik.http.routers.authelia.entrypoints=web,websecure"
      - "traefik.http.routers.authelia.tls=true"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
      # ForwardAuth middleware (attach to other routers as authelia@docker)
      - "traefik.http.middlewares.authelia.forwardauth.address=http://authelia:9091/api/authz/forward-auth"
      - "traefik.http.middlewares.authelia.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name"
    networks:
      - infra_shared
      - dev_tools

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
