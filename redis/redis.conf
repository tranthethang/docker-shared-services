# Redis Configuration File
# Generated for docker-compose setup
#
# Authentication: requirepass is supplied at runtime by docker-compose
# (`--requirepass ${REDIS_PASSWORD}`) so the secret is not committed here.

# Use the default port inside container
port 6379

# Enable persistence
save 900 1
save 300 10
save 60 10000

# Append-only file (AOF) configuration
appendonly yes
appendfilename "appendonly.aof"

# Database selection
databases 16
