services:
  redis:
    container_name: redis
    image: "redis:7.4-alpine"
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${REDIS_CPUS_RESERVED:-0.25}"
          memory: "${REDIS_MEMORY_RESERVED:-256M}"
    # Password comes from compose env at runtime (not committed in redis.conf).
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-Password102!}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-Password102!}"

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  redis_data:
