services:
  redis:
    container_name: redis
    image: "redis:7.4-alpine"
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${REDIS_CPUS_RESERVED:-0.25}"
          memory: "${REDIS_MEMORY_RESERVED:-256M}"
    # Substitute requirepass in a temp config so the password is not a CLI argument.
    # Re-exec the image entrypoint so redis-server drops to the redis user.
    command:
      - sh
      - -c
      - |
        set -eu
        escaped=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[&|\\]/\\&/g')
        sed "s|\$${REDIS_PASSWORD}|$$escaped|g" /etc/redis/redis.conf > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        chmod 600 /tmp/redis.conf
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - data_net
    volumes:
      - redis_data:/data
      - ./redis.conf:/etc/redis/redis.conf:ro
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — run make setup}"

networks:
  data_net:
    external: true

volumes:
  redis_data:
