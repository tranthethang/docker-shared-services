services:
  redis:
    container_name: redis
    image: "redis:7.4-alpine"
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPUS_LIMIT:-0.5}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${REDIS_CPUS_RESERVED:-0.25}"
          memory: "${REDIS_MEMORY_RESERVED:-256M}"
    command: redis-server /etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-password102}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - infra_shared
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  infra_shared:
    name: infra_shared
    external: true

volumes:
  redis_data:
