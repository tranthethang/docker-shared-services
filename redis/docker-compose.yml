services:
  redis:
    container_name: dev_redis
    image: "redis:7-alpine"
    restart: "${RESTART_POLICY:-always}"
    command: >
      --requirepass ${REDIS_PASSWORD:-password102}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - dev_tools
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev_tools:
    name: dev_tools
    driver: bridge

volumes:
  redis_data:
