services:
  centrifugo:
    container_name: centrifugo
    image: centrifugo/centrifugo:v5.4.9
    restart: "${RESTART_POLICY:-unless-stopped}"
    command: ["centrifugo", "--config=/centrifugo/config.json"]
    deploy:
      resources:
        limits:
          cpus: "${CENTRIFUGO_CPUS_LIMIT:-0.25}"
          memory: "${CENTRIFUGO_MEMORY_LIMIT:-64M}"
        reservations:
          cpus: "${CENTRIFUGO_CPUS_RESERVED:-0.05}"
          memory: "${CENTRIFUGO_MEMORY_RESERVED:-16M}"
    ports:
      - "127.0.0.1:${CENTRIFUGO_PORT:-8010}:8000"
    volumes:
      - ./config.json:/centrifugo/config.json:ro
    environment:
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env — run make setup}
      - CENTRIFUGO_TOKEN_USER_ID_CLAIM=user_id
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:?Set CENTRIFUGO_API_KEY in .env — run make setup}
      - CENTRIFUGO_ADMIN=false
      - CENTRIFUGO_ALLOWED_ORIGINS=${CENTRIFUGO_ALLOWED_ORIGINS:-*}
    networks:
      backend_net:
        aliases:
          - centrifugo
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend_net:
    external: true
