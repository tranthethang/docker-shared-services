services:
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.25.0}
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${TEMPORAL_CPUS_LIMIT:-1}"
          memory: "${TEMPORAL_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${TEMPORAL_CPUS_RESERVED:-0.5}"
          memory: "${TEMPORAL_MEMORY_RESERVED:-512M}"
    environment:
      - DB=${DB:-postgres12}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-Password102!}
      - POSTGRES_SEEDS=${POSTGRES_SEEDS:-postgres}
      # Archival Configuration
      - ARCHIVAL_ENABLED=${TEMPORAL_ARCHIVAL_ENABLED:-true}
      - DEFAULT_NAMESPACE_RETENTION=${TEMPORAL_ARCHIVAL_RETENTION_DAYS:-1}
      - DEFAULT_NAMESPACE_HISTORY_ARCHIVAL_STATE=enabled
      - DEFAULT_NAMESPACE_HISTORY_ARCHIVAL_URI=s3://${TEMPORAL_S3_BUCKET:-temporal-archival}/
      - AWS_ACCESS_KEY_ID=${TEMPORAL_S3_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${TEMPORAL_S3_SECRET_KEY:-Password102!}
      - AWS_REGION=${TEMPORAL_S3_REGION:-us-east-1}
      - TEMPORAL_S3_ENDPOINT=${TEMPORAL_S3_ENDPOINT:-http://minio:9000}
      - TEMPORAL_S3_S3_FORCE_PATH_STYLE=true
    networks:
      - infra_shared
      - dev_tools
    ports:
      - "127.0.0.1:${TEMPORAL_GRPC_PORT:-7233}:7233"
    stop_grace_period: 30s
    healthcheck:
      # auto-setup image exposes gRPC on 7233; TCP open ≈ frontend up.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7233'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  temporal-ui:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.temporal.rule=Host(`temporal.dss.localhost`)"
      - "traefik.http.routers.temporal.entrypoints=web,websecure"
      - "traefik.http.routers.temporal.tls=true"
      - "traefik.http.services.temporal.loadbalancer.server.port=8080"
    container_name: temporal-ui
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.30.0}
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${TEMPORAL_UI_CPUS_LIMIT:-0.5}"
          memory: "${TEMPORAL_UI_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${TEMPORAL_UI_CPUS_RESERVED:-0.2}"
          memory: "${TEMPORAL_UI_MEMORY_RESERVED:-256M}"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8083,https://temporal.dss.localhost
    networks:
      - infra_shared
      - dev_tools
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8083}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
