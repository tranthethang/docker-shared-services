services:
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:${TEMPORAL_VERSION:-latest}
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${TEMPORAL_CPUS_LIMIT:-1}"
          memory: "${TEMPORAL_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${TEMPORAL_CPUS_RESERVED:-0.5}"
          memory: "${TEMPORAL_MEMORY_RESERVED:-512M}"
    environment:
      - DB=${DB:-postgres12}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PWD=${POSTGRES_PWD:-password102}
      - POSTGRES_SEEDS=${POSTGRES_SEEDS:-postgres}
      # Archival Configuration
      - ARCHIVAL_ENABLED=${TEMPORAL_ARCHIVAL_ENABLED:-true}
      - DEFAULT_NAMESPACE_RETENTION=${TEMPORAL_ARCHIVAL_RETENTION_DAYS:-1}
      - DEFAULT_NAMESPACE_HISTORY_ARCHIVAL_STATE=enabled
      - DEFAULT_NAMESPACE_HISTORY_ARCHIVAL_URI=s3://${TEMPORAL_S3_BUCKET:-temporal-archival}/
      - AWS_ACCESS_KEY_ID=${TEMPORAL_S3_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${TEMPORAL_S3_SECRET_KEY:-password102}
      - AWS_REGION=${TEMPORAL_S3_REGION:-us-east-1}
      - TEMPORAL_S3_ENDPOINT=${TEMPORAL_S3_ENDPOINT:-http://minio:9000}
      - TEMPORAL_S3_S3_FORCE_PATH_STYLE=true
    networks:
      - infra_shared
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-latest}
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${TEMPORAL_UI_CPUS_LIMIT:-0.5}"
          memory: "${TEMPORAL_UI_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${TEMPORAL_UI_CPUS_RESERVED:-0.2}"
          memory: "${TEMPORAL_UI_MEMORY_RESERVED:-256M}"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8083,https://temporal.localhost
    networks:
      - infra_shared
    ports:
      - "${TEMPORAL_UI_PORT:-8083}:8080"
    depends_on:
      - temporal

networks:
