services:
  host-bridge:
    container_name: ${SANDBOX_NAME:+${SANDBOX_NAME}-}host-bridge
    image: haproxy:3.0.8
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${HOST_BRIDGE_CPUS_LIMIT:-0.25}"
          memory: "${HOST_BRIDGE_MEMORY_LIMIT:-128M}"
        reservations:
          cpus: "${HOST_BRIDGE_CPUS_RESERVED:-0.05}"
          memory: "${HOST_BRIDGE_MEMORY_RESERVED:-32M}"
    environment:
      SANDBOX_PREFIX: ${SANDBOX_NAME:+${SANDBOX_NAME}-}
    command:
      - sh
      - -c
      - |
        set -eu
        sed "s/__UPSTREAM_PREFIX__/$${SANDBOX_PREFIX}/g" /etc/haproxy/haproxy.cfg > /tmp/haproxy.runtime.cfg
        haproxy -c -f /tmp/haproxy.runtime.cfg
        exec haproxy -f /tmp/haproxy.runtime.cfg
    ports:
      - "127.0.0.1:${POSTGRES16_PORT:-5432}:5432"
      - "127.0.0.1:${PGVECTOR_PORT:-5433}:5433"
      - "127.0.0.1:${SUPABASE_DB_PORT:-5434}:5434"
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
      - "127.0.0.1:${MARIADB_PORT:-3307}:3307"
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
      - "127.0.0.1:${MEMCACHED_PORT:-11211}:11211"
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:9092:9092"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - data_net
      - backend_net
    volumes:
      - ./haproxy.cfg:/etc/haproxy/haproxy.cfg:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - |
          sed "s/__UPSTREAM_PREFIX__/$${SANDBOX_PREFIX}/g" /etc/haproxy/haproxy.cfg > /tmp/haproxy.check.cfg
          haproxy -c -f /tmp/haproxy.check.cfg
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  data_net:
    external: true
  backend_net:
    external: true
