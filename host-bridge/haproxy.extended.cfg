# Extended TCP profile (optional overlay). Append to haproxy.cfg at runtime; not loaded by default compose.
# Host aliases match root `.env.example` defaults. Upstreams use __UPSTREAM_PREFIX__ (see USAGE.md).

frontend fe_minio_s3
  bind *:9002
  default_backend be_minio_s3

backend be_minio_s3
  server minio __UPSTREAM_PREFIX__minio:9000

frontend fe_loki
  bind *:3100
  default_backend be_loki

backend be_loki
  server loki __UPSTREAM_PREFIX__loki:3100

frontend fe_otel_grpc
  bind *:4317
  default_backend be_otel_grpc

backend be_otel_grpc
  server otel-collector __UPSTREAM_PREFIX__otel-collector:4317

frontend fe_otel_http
  bind *:4318
  default_backend be_otel_http

backend be_otel_http
  server otel-collector __UPSTREAM_PREFIX__otel-collector:4318

frontend fe_temporal_grpc
  bind *:7233
  default_backend be_temporal_grpc

backend be_temporal_grpc
  server temporal __UPSTREAM_PREFIX__temporal:7233

frontend fe_centrifugo
  bind *:8010
  default_backend be_centrifugo

backend be_centrifugo
  server centrifugo __UPSTREAM_PREFIX__centrifugo:8000

frontend fe_gotenberg
  bind *:3030
  default_backend be_gotenberg

backend be_gotenberg
  server gotenberg __UPSTREAM_PREFIX__gotenberg:3000

frontend fe_libreoffice_uno
  bind *:2002
  default_backend be_libreoffice_uno

backend be_libreoffice_uno
  server libreoffice-writer __UPSTREAM_PREFIX__libreoffice-writer:2002

frontend fe_verdaccio
  bind *:4873
  default_backend be_verdaccio

backend be_verdaccio
  server verdaccio __UPSTREAM_PREFIX__verdaccio:4873

frontend fe_gitea_ssh
  bind *:2222
  default_backend be_gitea_ssh

backend be_gitea_ssh
  server gitea __UPSTREAM_PREFIX__gitea:22

frontend fe_jenkins_agent
  bind *:50000
  default_backend be_jenkins_agent

backend be_jenkins_agent
  server jenkins __UPSTREAM_PREFIX__jenkins:50000
