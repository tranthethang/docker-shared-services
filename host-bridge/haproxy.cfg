global
  log stdout format raw daemon warning

resolvers docker
  parse-resolv-conf
  hold valid 10s
  hold nx 3s
  hold other 3s
  hold refused 3s
  hold timeout 3s
  hold obsolete 3s

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  timeout client 1m
  timeout server 1m
  default-server init-addr last,libc,none resolvers docker resolve-prefer ipv4

frontend fe_postgres
  bind *:5432
  default_backend be_postgres

backend be_postgres
  server postgres __UPSTREAM_PREFIX__postgres:5432

frontend fe_pgvector
  bind *:5433
  default_backend be_pgvector

backend be_pgvector
  server pgvector __UPSTREAM_PREFIX__pgvector:5432

frontend fe_supabase_db
  bind *:5434
  default_backend be_supabase_db

backend be_supabase_db
  server supabase-db __UPSTREAM_PREFIX__supabase-db:5432

frontend fe_mysql8
  bind *:3306
  default_backend be_mysql8

backend be_mysql8
  server mysql8 __UPSTREAM_PREFIX__mysql8:3306

frontend fe_mariadb
  bind *:3307
  default_backend be_mariadb

backend be_mariadb
  server mariadb __UPSTREAM_PREFIX__mariadb:3306

frontend fe_mongodb
  bind *:27017
  default_backend be_mongodb

backend be_mongodb
  server mongodb __UPSTREAM_PREFIX__mongodb:27017

frontend fe_redis
  bind *:6379
  default_backend be_redis

backend be_redis
  server redis __UPSTREAM_PREFIX__redis:6379

frontend fe_memcached
  bind *:11211
  default_backend be_memcached

backend be_memcached
  server memcached __UPSTREAM_PREFIX__memcached:11211

frontend fe_rabbitmq
  bind *:5672
  default_backend be_rabbitmq

backend be_rabbitmq
  server rabbitmq __UPSTREAM_PREFIX__rabbitmq:5672

frontend fe_kafka
  bind *:9092
  default_backend be_kafka

backend be_kafka
  server kafka __UPSTREAM_PREFIX__kafka:9092

frontend fe_mailpit_smtp
  bind *:1025
  default_backend be_mailpit_smtp

backend be_mailpit_smtp
  server mailpit __UPSTREAM_PREFIX__mailpit:1025
