services:
  gotenberg:
    container_name: gotenberg
    image: gotenberg/gotenberg:8
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${GOTENBERG_CPUS_LIMIT:-1}"
          memory: "${GOTENBERG_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${GOTENBERG_CPUS_RESERVED:-0.1}"
          memory: "${GOTENBERG_MEMORY_RESERVED:-256M}"
    ports:
      - "127.0.0.1:${GOTENBERG_API_PORT:-3030}:3000"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
