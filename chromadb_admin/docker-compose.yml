services:
  chromadb-admin:
    container_name: chromadb-admin
    image: fengzhichao/chromadb-admin:0.0.2
    restart: "${RESTART_POLICY:-always}"
    ports:
      - "${CHROMADB_ADMIN_PORT:-8001}:3001"
    environment:
      - CHROMA_URL=${CHROMADB_ADMIN_URL:-http://chromadb:8000}
    deploy:
      resources:
        limits:
          cpus: "${CHROMADB_ADMIN_CPUS_LIMIT:-0.5}"
          memory: "${CHROMADB_ADMIN_MEMORY_LIMIT:-512M}"
    networks:
      - infra_shared
      - dev_tools

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
