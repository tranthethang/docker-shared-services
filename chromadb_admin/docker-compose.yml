services:
  chromadb-admin:
    container_name: chromadb-admin
    image: fengzhichao/chromadb-admin:0.0.2
    restart: "${RESTART_POLICY:-unless-stopped}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.chromadb-admin.rule=Host(`chromadb-admin.dss.localhost`)"
      - "traefik.http.routers.chromadb-admin.entrypoints=websecure"
      - "traefik.http.routers.chromadb-admin.tls=true"
      - "traefik.http.services.chromadb-admin.loadbalancer.server.port=3001"
    environment:
      - CHROMA_URL=${CHROMADB_ADMIN_URL:-http://chromadb:8000}
    deploy:
      resources:
        limits:
          cpus: "${CHROMADB_ADMIN_CPUS_LIMIT:-0.5}"
          memory: "${CHROMADB_ADMIN_MEMORY_LIMIT:-512M}"
    networks:
      - traefik_proxy
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
