services:
  adminer:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.adminer.rule=Host(`adminer.dss.localhost`)"
      - "traefik.http.routers.adminer.entrypoints=websecure"
      - "traefik.http.routers.adminer.tls=true"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"
    container_name: adminer
    image: adminer:5.4.1
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${ADMINER_CPUS_LIMIT:-0.25}"
          memory: "${ADMINER_MEMORY_LIMIT:-128M}"
        reservations:
          cpus: "${ADMINER_CPUS_RESERVED:-0.05}"
          memory: "${ADMINER_MEMORY_RESERVED:-32M}"
    networks:
      - traefik_proxy
      - backend_net
      - data_net
    volumes:
      - ./adminer.css:/var/www/html/adminer.css:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
  data_net:
    external: true
