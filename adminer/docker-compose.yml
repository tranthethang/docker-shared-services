services:
  adminer:
    container_name: adminer
    image: adminer:5.4.1
    restart: "${RESTART_POLICY:-always}"
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - ./adminer/adminer.css:/var/www/html/adminer.css:ro  
networks:
