services:
  # Named volumes mount root-owned; fix ownership before appuser (uid 999) starts.
  crawl4ai-volume-init:
    container_name: ${SANDBOX_NAME:+${SANDBOX_NAME}-}crawl4ai-volume-init
    image: alpine:3.21
    restart: "no"
    user: "0:0"
    volumes:
      - crawl4ai_data:/var/lib/crawl4ai
    command:
      - sh
      - -ec
      - |
        chown -R 999:999 /var/lib/crawl4ai

  crawl4ai:
    labels:
      - "traefik.enable=true"
      - "sandbox.stack=${SANDBOX_NAME:-sandbox}"
      - "traefik.docker.network=${SANDBOX_NAME:+${SANDBOX_NAME}_}traefik_proxy"
      - "traefik.http.routers.crawl4ai.rule=Host(`crawl4ai.${DOMAIN:-sandbox.localhost}`)"
      - "traefik.http.routers.crawl4ai.entrypoints=web"
      - "traefik.http.services.crawl4ai.loadbalancer.server.port=11235"
    container_name: ${SANDBOX_NAME:+${SANDBOX_NAME}-}crawl4ai
    # Pin patch version for reproducibility (was :latest).
    image: "unclecode/crawl4ai:0.7.8"
    restart: "${RESTART_POLICY:-unless-stopped}"
    depends_on:
      crawl4ai-volume-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "${CRAWL4AI_CPUS_LIMIT:-1.5}"
          memory: "${CRAWL4AI_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${CRAWL4AI_CPUS_RESERVED:-0.5}"
          memory: "${CRAWL4AI_MEMORY_RESERVED:-512M}"
    environment:
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_TOKEN:-}
      - CRAWL4_AI_BASE_DIRECTORY=/var/lib/crawl4ai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    shm_size: "1gb"
    volumes:
      - crawl4ai_data:/var/lib/crawl4ai
    networks:
      - traefik_proxy
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  crawl4ai_data:
    name: ${SANDBOX_NAME:+${SANDBOX_NAME}_}crawl4ai_data

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
