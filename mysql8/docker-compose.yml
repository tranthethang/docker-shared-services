services:
  mysql8:
    container_name: mysql8
    image: "mysql:8.4.6"
    restart: "${RESTART_POLICY:-unless-stopped}"
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          cpus: "${MYSQL_CPUS_LIMIT:-1}"
          memory: "${MYSQL_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MYSQL_CPUS_RESERVED:-0.5}"
          memory: "${MYSQL_MEMORY_RESERVED:-512M}"
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-cloud}"
      MYSQL_USER: "${MYSQL_USER:-uid}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env — run make setup}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env — run make setup}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    networks:
      - data_net
    volumes:
      - mysql_data:/var/lib/mysql
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  data_net:
    external: true

volumes:
  mysql_data:
