services:
  sonarqube:
    container_name: sonarqube
    image: sonarqube:community
    restart: "${RESTART_POLICY:-always}"
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    deploy:
      resources:
        limits:
          cpus: "${SONARQUBE_CPUS_LIMIT:-2}"
          memory: "${SONARQUBE_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${SONARQUBE_CPUS_RESERVED:-1}"
          memory: "${SONARQUBE_MEMORY_RESERVED:-1G}"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: "${POSTGRES_USER:-postgres}"
      SONAR_JDBC_PASSWORD: "${POSTGRES_PASSWORD:-password102}"
    networks:
      - infra_shared
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
