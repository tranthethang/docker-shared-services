services:
  sonarqube:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.dss.localhost`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls=true"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"
    container_name: sonarqube
    image: sonarqube:26.9.0.129388-community
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SONARQUBE_CPUS_LIMIT:-2}"
          memory: "${SONARQUBE_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${SONARQUBE_CPUS_RESERVED:-1}"
          memory: "${SONARQUBE_MEMORY_RESERVED:-1G}"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://${POSTGRES16_HOST:-postgres}:${POSTGRES16_PORT:-5432}/${POSTGRES16_DB:-sonarqube}
      SONAR_JDBC_USERNAME: "${POSTGRES16_USER:-postgres}"
      SONAR_JDBC_PASSWORD: "${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env — run make setup}"
    networks:
      - traefik_proxy
      - backend_net
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
