services:
  # Copy garage.toml into a named volume. Bind mounts (file or directory) to /etc/garage
  # are visible on the host but often ENOENT inside dxflrs/garage distroless (exec + healthcheck).
  garage-config-init:
    container_name: garage-config-init
    image: alpine:3.21
    restart: "no"
    volumes:
      - ./config/garage.toml:/src/garage.toml:ro
      - garage_config:/etc/garage
    command:
      - sh
      - -ec
      - |
        cp /src/garage.toml /etc/garage/garage.toml
        chmod 444 /etc/garage/garage.toml

  garage:
    container_name: garage
    # dxflrs/garage v2.4.1 — latest stable release (Sep 2026).
    # Pin explicitly; do NOT use ":latest" for a storage backend.
    image: dxflrs/garage:v2.4.1
    restart: "${RESTART_POLICY:-unless-stopped}"
    depends_on:
      garage-config-init:
        condition: service_completed_successfully
    # Global flags (-c) must precede the subcommand (Garage clap parsing).
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    deploy:
      resources:
        limits:
          cpus: "${GARAGE_CPUS_LIMIT:-1}"
          memory: "${GARAGE_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${GARAGE_CPUS_RESERVED:-0.5}"
          memory: "${GARAGE_MEMORY_RESERVED:-512M}"
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env (openssl rand -base64 32)}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN:-${GARAGE_ADMIN_TOKEN}}
      - GARAGE_CONFIG_FILE=/etc/garage/garage.toml
    volumes:
      - garage_config:/etc/garage:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.garage-s3.rule=Host(`s3.garage.dss.localhost`)"
      - "traefik.http.routers.garage-s3.entrypoints=web"
      - "traefik.http.routers.garage-s3.service=garage-s3"
      - "traefik.http.services.garage-s3.loadbalancer.server.port=3900"
      - "traefik.http.routers.garage-admin.rule=Host(`admin.garage.dss.localhost`)"
      - "traefik.http.routers.garage-admin.entrypoints=web"
      - "traefik.http.routers.garage-admin.service=garage-admin"
      - "traefik.http.services.garage-admin.loadbalancer.server.port=3903"
    networks:
      - traefik_proxy
      - backend_net
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage/garage.toml", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  garage_config:
  garage_meta:
  garage_data:
