services:
  garage:
    container_name: garage
    # dxflrs/garage v2.4.1 — latest stable release (Sep 2026).
    # Pin explicitly; do NOT use ":latest" for a storage backend.
    image: dxflrs/garage:v2.4.1
    restart: "${RESTART_POLICY:-unless-stopped}"
    # Explicit config path — do NOT rely on the image default /etc/garage.toml.
    # Bind-mounting a *single file* to /etc/garage.toml is invisible inside this
    # distroless image under OrbStack (ENOENT on docker exec / healthcheck),
    # which left the container permanently "unhealthy" and broke `docker exec … /garage …`.
    # Mount the config *directory* instead and point Garage at the file inside it.
    # Global flags (-c) must precede the subcommand (Garage clap parsing).
    command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
    deploy:
      resources:
        limits:
          cpus: "${GARAGE_CPUS_LIMIT:-1}"
          memory: "${GARAGE_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${GARAGE_CPUS_RESERVED:-0.5}"
          memory: "${GARAGE_MEMORY_RESERVED:-512M}"
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:?Set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN:?Set GARAGE_ADMIN_TOKEN in .env (openssl rand -base64 32)}
      - GARAGE_METRICS_TOKEN=${GARAGE_METRICS_TOKEN:-${GARAGE_ADMIN_TOKEN}}
      # So `docker exec garage /garage …` picks up the same config without -c.
      - GARAGE_CONFIG_FILE=/etc/garage/garage.toml
    volumes:
      - ./config:/etc/garage:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.garage-s3.rule=Host(`s3.garage.dss.localhost`)"
      - "traefik.http.routers.garage-s3.entrypoints=websecure"
      - "traefik.http.routers.garage-s3.tls=true"
      - "traefik.http.routers.garage-s3.service=garage-s3"
      - "traefik.http.services.garage-s3.loadbalancer.server.port=3900"
      - "traefik.http.routers.garage-admin.rule=Host(`admin.garage.dss.localhost`)"
      - "traefik.http.routers.garage-admin.entrypoints=websecure"
      - "traefik.http.routers.garage-admin.tls=true"
      - "traefik.http.routers.garage-admin.service=garage-admin"
      - "traefik.http.services.garage-admin.loadbalancer.server.port=3903"
    networks:
      - traefik_proxy
      - backend_net
    # Image is distroless (no shell/curl). CLI + healthcheck share GARAGE_CONFIG_FILE.
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  garage_meta:
  garage_data:
