[package]
name = "dss"
version = "0.1.0"
edition = "2021"
description = "Docker shared services manager"

[[bin]]
name = "dss"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bcrypt = "0.17"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
hmac = "0.12"
rand = "0.10"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
lto = true
strip = true
