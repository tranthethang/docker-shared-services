# Minimal Supabase stack for docker-shared-services
# Services: Identity (Auth) + Catalog DB + Asset Storage + Studio + Kong
# Removed: rest, realtime, graphql, imgproxy, edge-runtime, analytics/logflare,
#          vector, supavisor/pooler
#
# Usage (via repo Makefile):
#   make up service=supabase
#   make down service=supabase
# Or locally: sh run.sh start

services:

  supabase-studio:
    container_name: supabase-studio
    image: supabase/studio:2026.08.03-sha-022b374
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_STUDIO_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_STUDIO_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_STUDIO_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_STUDIO_MEMORY_RESERVED:-128M}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    depends_on:
      supabase-meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-supabase-db}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password102}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-Default Project}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-https://supabase.localhost}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./volumes/snippets:/app/snippets:z
    networks:
      - infra_shared
      - dev_tools

  supabase-kong:
    container_name: supabase-kong
    image: kong/kong:3.9.3
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_KONG_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_KONG_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_KONG_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_KONG_MEMORY_RESERVED:-128M}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_shared"
      - "traefik.http.routers.supabase.rule=Host(`${SUPABASE_SUBDOMAIN:-supabase}.${DOMAIN_NAME:-localhost}`)"
      - "traefik.http.routers.supabase.entrypoints=web,websecure"
      - "traefik.http.routers.supabase.tls=true"
      - "traefik.http.services.supabase.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      supabase-studio:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
      supabase-meta:
        condition: service_started
    ports:
      # 8002 avoids ChromaDB (8000); 8445 avoids Appsmith HTTPS (8444)
      - "${SUPABASE_KONG_HTTP_PORT:-8002}:8000/tcp"
      - "${SUPABASE_KONG_HTTPS_PORT:-8445}:8443/tcp"
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-password102}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    networks:
      infra_shared:
        aliases:
          - api-gw
      dev_tools:

  supabase-auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.189.0
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_AUTH_CPUS_LIMIT:-0.25}"
          memory: "${SUPABASE_AUTH_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${SUPABASE_AUTH_CPUS_RESERVED:-0.05}"
          memory: "${SUPABASE_AUTH_MEMORY_RESERVED:-64M}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-https://supabase.localhost/auth/v1}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-password102}@${POSTGRES_HOST:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-https://supabase.localhost}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-https://supabase.localhost/auth/v1}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      # Default to shared Mailpit on infra_shared / dev_tools
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-supabase}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-false}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-true}
    networks:
      - infra_shared
      - dev_tools

  supabase-storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.60.4
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_STORAGE_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_STORAGE_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_STORAGE_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_STORAGE_MEMORY_RESERVED:-128M}"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://supabase-storage:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-password102}@${POSTGRES_HOST:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-https://supabase.localhost}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-stub}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    networks:
      - infra_shared
      - dev_tools

  supabase-meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.96.6
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_META_CPUS_LIMIT:-0.25}"
          memory: "${SUPABASE_META_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${SUPABASE_META_CPUS_RESERVED:-0.05}"
          memory: "${SUPABASE_META_MEMORY_RESERVED:-64M}"
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST:-supabase-db}
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-password102}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    networks:
      - infra_shared
      - dev_tools

  # Dedicated Supabase Postgres (not shared pgvector/postgres stacks)
  supabase-db:
    container_name: supabase-db
    image: supabase/postgres:17.6.1.136
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_DB_CPUS_LIMIT:-1}"
          memory: "${SUPABASE_DB_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${SUPABASE_DB_CPUS_RESERVED:-0.25}"
          memory: "${SUPABASE_DB_MEMORY_RESERVED:-256M}"
    ports:
      # Host 5434 avoids pgvector (5432) and postgres16 (5433)
      - "${SUPABASE_DB_PORT:-5434}:5432"
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - supabase_db_config:/etc/postgresql-custom
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "postgres",
          "-h",
          "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-password102}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password102}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal"
      ]
    networks:
      - infra_shared
      - dev_tools

volumes:
  supabase_db_config:
    name: supabase_db_config

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
