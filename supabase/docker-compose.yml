# Minimal Supabase stack for docker-shared-services
# Services: Identity (Auth) + Catalog DB + Asset Storage + Realtime + Studio + Kong
# Removed: rest, graphql, imgproxy, edge-runtime, analytics/logflare,
#          vector, supavisor/pooler
#
# Usage (via repo Makefile):
#   make up service=supabase
#   make down service=supabase
# Or locally: sh run.sh start

services:

  supabase-studio:
    container_name: supabase-studio
    image: supabase/studio:2026.08.03-sha-022b374
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_STUDIO_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_STUDIO_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_STUDIO_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_STUDIO_MEMORY_RESERVED:-128M}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200)\
            \ throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    depends_on:
      supabase-meta:
        condition: service_healthy
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-supabase-db}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make setup}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Set PG_META_CRYPTO_KEY in .env — run make setup}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-Default Project}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-https://supabase.dss.localhost}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Set ANON_KEY in .env — run make setup}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in .env — run make setup}
      AUTH_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run make setup}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - ./volumes/snippets:/app/snippets:z
    networks:
      - backend_net
      - data_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-kong:
    container_name: supabase-kong
    image: kong/kong:3.9.3
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_KONG_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_KONG_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_KONG_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_KONG_MEMORY_RESERVED:-128M}"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.services.supabase.loadbalancer.server.port=8000"
      # Public APIs (clients use anon/service keys)
      - "traefik.http.routers.supabase-api.rule=Host(`${SUPABASE_SUBDOMAIN:-supabase}.${DOMAIN_NAME:-dss.localhost}`) && (PathPrefix(`/auth`)\
        \ || PathPrefix(`/storage`) || PathPrefix(`/realtime`) || PathPrefix(`/pg`) || PathPrefix(`/.well-known`) || PathPrefix(`/api/mcp`)\
        \ || PathPrefix(`/mcp`))"
      - "traefik.http.routers.supabase-api.entrypoints=websecure"
      - "traefik.http.routers.supabase-api.tls=true"
      - "traefik.http.routers.supabase-api.priority=100"
      - "traefik.http.routers.supabase-api.service=supabase"
      # Studio UI (un-gated local dev)
      - "traefik.http.routers.supabase-studio.rule=Host(`${SUPABASE_STUDIO_HOSTNAME:-studio.dss.localhost}`)"
      - "traefik.http.routers.supabase-studio.entrypoints=websecure"
      - "traefik.http.routers.supabase-studio.tls=true"
      - "traefik.http.routers.supabase-studio.priority=50"
      - "traefik.http.routers.supabase-studio.service=supabase"
      # Legacy Studio on supabase.dss.localhost → redirect to studio.dss.localhost
      - "traefik.http.middlewares.supabase-to-studio.redirectregex.regex=^https?://[^/]+/(.*)"
      - "traefik.http.middlewares.supabase-to-studio.redirectregex.replacement=https://${SUPABASE_STUDIO_HOSTNAME:-studio.dss.localhost}/$${1}"
      - "traefik.http.middlewares.supabase-to-studio.redirectregex.permanent=false"
      - "traefik.http.routers.supabase-ui-redirect.rule=Host(`${SUPABASE_SUBDOMAIN:-supabase}.${DOMAIN_NAME:-dss.localhost}`)"
      - "traefik.http.routers.supabase-ui-redirect.entrypoints=websecure"
      - "traefik.http.routers.supabase-ui-redirect.tls=true"
      - "traefik.http.routers.supabase-ui-redirect.priority=1"
      - "traefik.http.routers.supabase-ui-redirect.middlewares=supabase-to-studio"
      - "traefik.http.routers.supabase-ui-redirect.service=supabase"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      supabase-studio:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
      realtime:
        condition: service_healthy
      supabase-meta:
        condition: service_healthy
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${ANON_KEY:?Set ANON_KEY in .env — run make setup}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in .env — run make setup}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      ANON_KEY_ASYMMETRIC: ${ANON_KEY_ASYMMETRIC:-}
      SERVICE_ROLE_KEY_ASYMMETRIC: ${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env — run make setup}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    networks:
      traefik_proxy:
      backend_net:
        aliases:
          - api-gw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-auth:
    container_name: supabase-auth
    image: supabase/gotrue:v2.189.0
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_AUTH_CPUS_LIMIT:-0.25}"
          memory: "${SUPABASE_AUTH_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${SUPABASE_AUTH_CPUS_RESERVED:-0.05}"
          memory: "${SUPABASE_AUTH_MEMORY_RESERVED:-64M}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-https://supabase.dss.localhost/auth/v1}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make
        setup}@${POSTGRES_HOST:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-https://supabase.dss.localhost}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run make setup}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-https://supabase.dss.localhost/auth/v1}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      # Default to shared Mailpit on backend_net
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-supabase}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-false}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-true}
    networks:
      - backend_net
      - data_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-storage:
    container_name: supabase-storage
    image: supabase/storage-api:v1.60.4
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_STORAGE_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_STORAGE_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_STORAGE_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_STORAGE_MEMORY_RESERVED:-128M}"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://supabase-storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${ANON_KEY:?Set ANON_KEY in .env — run make setup}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY in .env — run make setup}
      AUTH_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run make setup}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make setup}@${POSTGRES_HOST:-supabase-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-https://supabase.dss.localhost}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-stub}
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID:?Set S3_PROTOCOL_ACCESS_KEY_ID in .env — run make setup}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET:?Set S3_PROTOCOL_ACCESS_KEY_SECRET in .env — run make
        setup}
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    networks:
      - backend_net
      - data_net

  # Container name is intentional: Realtime derives tenant id from the subdomain
  # (realtime-dev). Do not rename to supabase-realtime.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.102.3
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_REALTIME_CPUS_LIMIT:-0.5}"
          memory: "${SUPABASE_REALTIME_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${SUPABASE_REALTIME_CPUS_RESERVED:-0.1}"
          memory: "${SUPABASE_REALTIME_MEMORY_RESERVED:-128M}"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST:-supabase-db}
      DB_PORT: ${POSTGRES_PORT:-5432}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make setup}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?Set REALTIME_DB_ENC_KEY in .env — run make setup}
      API_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run make setup}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env — run make setup}
      METRICS_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run make setup}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    networks:
      - backend_net
      - data_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  supabase-meta:
    container_name: supabase-meta
    image: supabase/postgres-meta:v0.96.6
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_META_CPUS_LIMIT:-0.25}"
          memory: "${SUPABASE_META_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${SUPABASE_META_CPUS_RESERVED:-0.05}"
          memory: "${SUPABASE_META_MEMORY_RESERVED:-64M}"
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() =>\
            \ process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST:-supabase-db}
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make setup}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Set PG_META_CRYPTO_KEY in .env — run make setup}
    networks:
      - backend_net
      - data_net

  # Dedicated Supabase Postgres (not shared pgvector/postgres stacks)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  supabase-db:
    container_name: supabase-db
    image: supabase/postgres:17.6.1.136
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${SUPABASE_DB_CPUS_LIMIT:-1}"
          memory: "${SUPABASE_DB_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${SUPABASE_DB_CPUS_RESERVED:-0.25}"
          memory: "${SUPABASE_DB_MEMORY_RESERVED:-256M}"
    ports:
      # Host 5434 avoids pgvector (5432) and postgres16 (5433)
      - "127.0.0.1:${SUPABASE_DB_PORT:-5434}:5432"
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # Fix auth.uid/role/email ownership for GoTrue (see auth-owner.sql)
      - ./volumes/db/auth-owner.sql:/docker-entrypoint-initdb.d/init-scripts/99-auth-owner.sql:Z
      # Storage SET ROLE grants for Studio bucket list (see storage-grants.sql)
      - ./volumes/db/storage-grants.sql:/docker-entrypoint-initdb.d/init-scripts/99-storage-grants.sql:Z
      # Realtime Elixir metadata schema (_realtime)
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - supabase_db_data:/var/lib/postgresql/data:Z
      - supabase_db_config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — run make setup}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run make setup}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    networks:
      - data_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  supabase_db_config:
    name: supabase_db_config
  supabase_db_data:
    name: supabase_db_data

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
  data_net:
    external: true
