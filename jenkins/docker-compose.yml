services:
  jenkins:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.dss.localhost`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.routers.jenkins.tls=true"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    # Pin LTS patch (was floating lts-alpine channel tag).
    image: jenkins/jenkins:2.580.1-lts-alpine
    container_name: jenkins
    restart: "${RESTART_POLICY:-unless-stopped}"
    ports:
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50000}:50000"
    deploy:
      resources:
        limits:
          cpus: "${JENKINS_CPUS_LIMIT:-2}"
          memory: "${JENKINS_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${JENKINS_CPUS_RESERVED:-1}"
          memory: "${JENKINS_MEMORY_RESERVED:-1G}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_proxy
      - backend_net

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - JENKINS_OPTS=--httpPort=8080
      - TZ="${TZ:-Asia/Ho_Chi_Minh}"
      - POSTGRES_HOST=${POSTGRES16_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES16_PORT:-5432}
      - JENKINS_DB_NAME=${JENKINS_DB_NAME:-jenkins}
      - POSTGRES_USER=${POSTGRES16_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env — run make setup}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  jenkins_home:
