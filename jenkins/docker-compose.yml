services:
  jenkins:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.localhost`)"
      - "traefik.http.routers.jenkins.entrypoints=web,websecure"
      - "traefik.http.routers.jenkins.tls=true"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"
    image: jenkins/jenkins:lts-alpine
    container_name: jenkins
    restart: "${RESTART_POLICY:-always}"
    ports:
      - "${JENKINS_PORT:-8090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    deploy:
      resources:
        limits:
          cpus: "${JENKINS_CPUS_LIMIT:-2}"
          memory: "${JENKINS_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${JENKINS_CPUS_RESERVED:-1}"
          memory: "${JENKINS_MEMORY_RESERVED:-1G}"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - infra_shared
      - dev_tools

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - JENKINS_OPTS=--httpPort=8080
      - TZ="${TZ:-Asia/Ho_Chi_Minh}"
      - POSTGRES_HOST=${POSTGRES_HOST:-pgvector}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - JENKINS_DB_NAME=${JENKINS_DB_NAME:-jenkins}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password102}

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  jenkins_home:
