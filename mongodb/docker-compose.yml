services:
  mongodb:
    container_name: mongodb
    image: "mongo:8.0.16"
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${MONGODB_CPUS_LIMIT:-1}"
          memory: "${MONGODB_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MONGODB_CPUS_RESERVED:-0.5}"
          memory: "${MONGODB_MEMORY_RESERVED:-512M}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-Password102!}"
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - mongodb_data:/data/db
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase\
            \ admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  mongodb_data:
