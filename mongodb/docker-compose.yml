services:
  mongodb:
    container_name: dev_mongodb
    image: "mongo:8.0"
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${MONGODB_CPUS_LIMIT:-1}"
          memory: "${MONGODB_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MONGODB_CPUS_RESERVED:-0.5}"
          memory: "${MONGODB_MEMORY_RESERVED:-512M}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:-password102}"
    ports:
      - "${MONGO_PORT:-27017}:27017"
    networks:
      - dev_tools
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "localhost", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  dev_tools:
    name: dev_tools
    driver: bridge

volumes:
  mongodb_data:
