services:
  pgvector:
    container_name: pgvector
    image: pgvector/pgvector:pg17
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS_LIMIT:-1}"
          memory: "${POSTGRES_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${POSTGRES_CPUS_RESERVED:-0.5}"
          memory: "${POSTGRES_MEMORY_RESERVED:-512M}"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Password102!}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  pgvector_data:
