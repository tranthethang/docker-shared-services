services:
  mailpit:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.dss.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    container_name: mailpit
    image: axllent/mailpit:v1.27.11
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${MAILPIT_CPUS_LIMIT:-0.5}"
          memory: "${MAILPIT_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${MAILPIT_CPUS_RESERVED:-0.25}"
          memory: "${MAILPIT_MEMORY_RESERVED:-256M}"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - traefik_proxy
      - backend_net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
