services:
  mailpit:
    labels:
      - "traefik.enable=true"
      - "sandbox.stack=${SANDBOX_NAME:-sandbox}"
      - "traefik.docker.network=${SANDBOX_NAME:+${SANDBOX_NAME}_}traefik_proxy"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.${DOMAIN:-sandbox.localhost}`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    container_name: ${SANDBOX_NAME:+${SANDBOX_NAME}-}mailpit
    image: axllent/mailpit:v1.27.11
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${MAILPIT_CPUS_LIMIT:-0.5}"
          memory: "${MAILPIT_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${MAILPIT_CPUS_RESERVED:-0.25}"
          memory: "${MAILPIT_MEMORY_RESERVED:-256M}"
    networks:
      - traefik_proxy
      - backend_net
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
