services:
  mailpit:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web,websecure"
      - "traefik.http.routers.mailpit.tls=true"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    container_name: mailpit
    image: axllent/mailpit:v1.27.11
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${MAILPIT_CPUS_LIMIT:-0.5}"
          memory: "${MAILPIT_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${MAILPIT_CPUS_RESERVED:-0.25}"
          memory: "${MAILPIT_MEMORY_RESERVED:-256M}"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
