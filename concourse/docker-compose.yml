services:
  concourse:
    image: concourse/concourse:7.14.3
    container_name: concourse
    restart: "${RESTART_POLICY:-always}"
    command: quickstart
    volumes:
      - concourse_data:/concourse
    ports:
      - "${CONCOURSE_PORT:-8070}:8080"
    deploy:
      resources:
        limits:
          cpus: "${CONCOURSE_CPUS_LIMIT:-2}"
          memory: "${CONCOURSE_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${CONCOURSE_CPUS_RESERVED:-1}"
          memory: "${CONCOURSE_MEMORY_RESERVED:-1G}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      CONCOURSE_POSTGRES_HOST: "${POSTGRES_HOST:-pgvector}"
      CONCOURSE_POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      CONCOURSE_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password102}"
      CONCOURSE_POSTGRES_DATABASE: "${CONCOURSE_DB_NAME:-concourse}"
      CONCOURSE_EXTERNAL_URL: "http://${CONCOURSE_HOST:-concourse.localhost}"
      CONCOURSE_ADD_LOCAL_USER: "${CONCOURSE_ADD_LOCAL_USER:-admin:admin}"
      CONCOURSE_MAIN_TEAM_LOCAL_USER: "${CONCOURSE_MAIN_TEAM_LOCAL_USER:-admin}"
      CONCOURSE_WORKER_GARDEN_NETWORK: "${CONCOURSE_WORKER_GARDEN_NETWORK:-infra_shared}"
    networks:
      - infra_shared
      - dev_tools

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
volumes:
  concourse_data:
