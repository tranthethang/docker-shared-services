services:
  concourse:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.concourse.rule=Host(`concourse.dss.localhost`)"
      - "traefik.http.routers.concourse.entrypoints=websecure"
      - "traefik.http.routers.concourse.tls=true"
      - "traefik.http.services.concourse.loadbalancer.server.port=8080"
    image: concourse/concourse:7.14.3
    container_name: concourse
    restart: "${RESTART_POLICY:-unless-stopped}"
    command: quickstart
    volumes:
      - concourse_data:/concourse
    deploy:
      resources:
        limits:
          cpus: "${CONCOURSE_CPUS_LIMIT:-2}"
          memory: "${CONCOURSE_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "${CONCOURSE_CPUS_RESERVED:-1}"
          memory: "${CONCOURSE_MEMORY_RESERVED:-1G}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      CONCOURSE_POSTGRES_HOST: "${POSTGRES16_HOST:-postgres}"
      CONCOURSE_POSTGRES_PORT: "${POSTGRES16_PORT:-5432}"
      CONCOURSE_POSTGRES_USER: "${POSTGRES16_USER:-postgres}"
      CONCOURSE_POSTGRES_PASSWORD: "${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env — run make setup}"
      CONCOURSE_POSTGRES_DATABASE: "${CONCOURSE_DB_NAME:-concourse}"
      CONCOURSE_EXTERNAL_URL: "https://${CONCOURSE_HOST:-concourse.dss.localhost}"
      CONCOURSE_ADD_LOCAL_USER: "${CONCOURSE_ADD_LOCAL_USER:-admin:admin}"
      CONCOURSE_MAIN_TEAM_LOCAL_USER: "${CONCOURSE_MAIN_TEAM_LOCAL_USER:-admin}"
      CONCOURSE_WORKER_GARDEN_NETWORK: "${CONCOURSE_WORKER_GARDEN_NETWORK:-backend_net}"
    networks:
      - traefik_proxy
      - backend_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  concourse_data:
