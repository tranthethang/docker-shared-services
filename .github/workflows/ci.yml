name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dss binary
        run: make build

      - name: Create disposable Compose environment
        run: |
          cli/target/release/dss env create
          cli/target/release/dss env passwords
          cli/target/release/dss env fill-secrets

      - name: Run the quality gate
        run: make check

      - name: Smoke-test an exported stack
        run: |-
          dest="$RUNNER_TEMP/dss-export-smoke"
          cli/target/release/dss package --name smoke --services memcached --dest "$dest"
          cd "$dest"
          make build
          cli/target/release/dss env create
          cli/target/release/dss env passwords
          cli/target/release/dss env fill-secrets
          make validate
