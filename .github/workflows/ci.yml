name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.10.6"

      - name: Check dependency lockfile
        run: uv lock --check

      - name: Create disposable Compose environment
        run: |
          uv run --frozen --no-dev python -m dss.cli.env create all
          uv run --frozen --no-dev python -m dss.cli.env fill-shared-password
          uv run --frozen --no-dev python -m dss.cli.env fill-secrets all

      - name: Run the quality gate
        run: make check

      - name: Smoke-test an exported stack
        run: |-
          dest="$RUNNER_TEMP/dss-export-smoke"
          uv run --frozen --no-dev python -c 'import sys; from pathlib import Path; from dss.package.export import export_stack; export_stack(["memcached"], "smoke", destination=Path(sys.argv[1]))' "$dest"
          cd "$dest"
          uv run --frozen --no-dev python -m dss.cli.env create all
          uv run --frozen --no-dev python -m dss.cli.env fill-shared-password
          uv run --frozen --no-dev python -m dss.cli.env fill-secrets all
          make validate
