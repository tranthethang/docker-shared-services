services:
  appsmith:
    labels:
      - "traefik.enable=true"
      - "dss.stack=${DSS_NAME:-dss}"
      - "traefik.docker.network=${DSS_NAME:+${DSS_NAME}_}traefik_proxy"
      - "traefik.http.routers.appsmith.rule=Host(`appsmith.${DOMAIN:-dss.localhost}`)"
      - "traefik.http.routers.appsmith.entrypoints=web"
      - "traefik.http.services.appsmith.loadbalancer.server.port=80"
    container_name: ${DSS_NAME:+${DSS_NAME}-}appsmith
    image: appsmith/appsmith-ce:v2.5.0
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${APPSMITH_CPUS_LIMIT:-2}"
          memory: "${APPSMITH_MEMORY_LIMIT:-4G}"
    volumes:
      - appsmith_data:/appsmith-stacks
    networks:
      - traefik_proxy
      - backend_net
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health || curl -fsS http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  appsmith_data:
    name: appsmith_data

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
  data_net:
    external: true
