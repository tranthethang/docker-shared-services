# LiteLLM proxy. Add models and virtual keys in the admin UI (stored in Postgres).
# Provider API keys are not stored in this file. The UI encrypts them with LITELLM_SALT_KEY.
# Prompt and response bodies are not logged.

model_list: []

general_settings:
  store_model_in_db: true
  database_connection_pool_limit: 5

litellm_settings:
  turn_off_message_logging: true
  request_timeout: 120

router_settings:
  # Unlisted error types use num_retries. InternalServerErrorRetries is applied
  # on 5xx after v1.90.2.
  num_retries: 1
  retry_policy:
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 3
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 1
