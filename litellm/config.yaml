# LiteLLM proxy. This file registers no models and no virtual keys.
# Add both in the Admin UI. They stay in Postgres while store_model_in_db is true.
# LITELLM_SALT_KEY encrypts provider credentials saved there. Do not change it later.

model_list: []

general_settings:
  store_model_in_db: true
  database_connection_pool_limit: 5

litellm_settings:
  callbacks:
    - reject_master_key_inference.handler
  turn_off_message_logging: false
  # Seconds. Matches contract-audit AI_REQUEST_TIMEOUT_MS (600000). The proxy reads this at startup.
  request_timeout: 600

router_settings:
  # Unlisted error types use num_retries. InternalServerErrorRetries is applied
  # on 5xx after v1.90.2.
  num_retries: 1
  retry_policy:
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 3
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 1
