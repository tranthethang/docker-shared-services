# LiteLLM proxy. These models load from this file at startup.
# Provider API keys come from the environment. This file stores no key value.
# Start inserts the shared virtual key. Extra keys still use the Admin UI.
# Prompt and response bodies are not logged.

model_list:
  - model_name: gpt-6.2-astra
    litellm_params:
      model: openai/gpt-6.2-astra
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: high
  - model_name: gpt-6.2-sol
    litellm_params:
      model: openai/gpt-6.2-sol
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: high
  - model_name: gpt-6.1-terra
    litellm_params:
      model: openai/gpt-6.1-terra
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: high
  - model_name: gpt-6-luna
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: high
  - model_name: claude-fable-5-2
    litellm_params:
      model: anthropic/claude-fable-5-2
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: high
  - model_name: claude-opus-5-5
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: high
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: medium

general_settings:
  store_model_in_db: true
  database_connection_pool_limit: 5

litellm_settings:
  turn_off_message_logging: true
  request_timeout: 120

router_settings:
  # Unlisted error types use num_retries. InternalServerErrorRetries is applied
  # on 5xx after v1.90.2.
  num_retries: 1
  retry_policy:
    RateLimitErrorRetries: 3
    TimeoutErrorRetries: 3
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    InternalServerErrorRetries: 1
