services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${WOODPECKER_CPUS_LIMIT:-1}"
          memory: "${WOODPECKER_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${WOODPECKER_CPUS_RESERVED:-0.5}"
          memory: "${WOODPECKER_MEMORY_RESERVED:-512M}"
    env_file:
      - ./.env
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - WOODPECKER_OPEN=${WOODPECKER_OPEN:-true}
      - WOODPECKER_HOST=https://${WOODPECKER_SUBDOMAIN:-woodpecker}.${DOMAIN_NAME:-dss.localhost}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN:-}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?Set WOODPECKER_AGENT_SECRET in woodpecker/.env (openssl rand -hex
        32)}
      - WOODPECKER_LOG_LEVEL=${WOODPECKER_LOG_LEVEL:-info}
      - WOODPECKER_DATABASE_DRIVER=sqlite3
      - WOODPECKER_DATABASE_DATASOURCE=/var/lib/woodpecker/woodpecker.sqlite
      - WOODPECKER_GITEA=${WOODPECKER_GITEA:-true}
      - WOODPECKER_GITEA_URL=http://gitea:3000
      - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT:-}
      - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET:-}
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    networks:
      - infra_shared
      - dev_tools
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.woodpecker.rule=Host(`${WOODPECKER_SUBDOMAIN:-woodpecker}.${DOMAIN_NAME:-dss.localhost}`)"
      - "traefik.http.routers.woodpecker.entrypoints=web,websecure"
      - "traefik.http.routers.woodpecker.tls=true"
      - "traefik.http.services.woodpecker.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/healthz || wget -q --spider http://127.0.0.1:8000/ || exit\
            \ 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${WOODPECKER_AGENT_CPUS_LIMIT:-1}"
          memory: "${WOODPECKER_AGENT_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${WOODPECKER_AGENT_CPUS_RESERVED:-0.5}"
          memory: "${WOODPECKER_AGENT_MEMORY_RESERVED:-512M}"
    depends_on:
      woodpecker-server:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?Set WOODPECKER_AGENT_SECRET in woodpecker/.env (openssl rand -hex
        32)}
      - WOODPECKER_MAX_WORKFLOWS=${WOODPECKER_MAX_WORKFLOWS:-2}
      - WOODPECKER_BACKEND_DOCKER=true
    volumes:
      # RW required for Docker pipeline backend (SEC-01 intentionally not :ro).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infra_shared
      - dev_tools

volumes:
  woodpecker_data:
    name: woodpecker_data

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
