services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3.19.0
    container_name: woodpecker-server
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${WOODPECKER_CPUS_LIMIT:-1}"
          memory: "${WOODPECKER_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${WOODPECKER_CPUS_RESERVED:-0.5}"
          memory: "${WOODPECKER_MEMORY_RESERVED:-512M}"
    env_file:
      - ./.env
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - WOODPECKER_OPEN=${WOODPECKER_OPEN:-true}
      - WOODPECKER_HOST=https://${WOODPECKER_SUBDOMAIN:-woodpecker}.${DOMAIN_NAME:-dss.localhost}
      - WOODPECKER_ADMIN=${WOODPECKER_ADMIN:-}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?Set WOODPECKER_AGENT_SECRET in woodpecker/.env (openssl rand -hex
        32)}
      - WOODPECKER_LOG_LEVEL=${WOODPECKER_LOG_LEVEL:-info}
      - WOODPECKER_DATABASE_DRIVER=sqlite3
      - WOODPECKER_DATABASE_DATASOURCE=/var/lib/woodpecker/woodpecker.sqlite
      - WOODPECKER_GITEA=${WOODPECKER_GITEA:-true}
      - WOODPECKER_GITEA_URL=http://gitea:3000
      - WOODPECKER_GITEA_CLIENT=${WOODPECKER_GITEA_CLIENT:-}
      - WOODPECKER_GITEA_SECRET=${WOODPECKER_GITEA_SECRET:-}
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    networks:
      - traefik_proxy
      - backend_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.woodpecker.rule=Host(`${WOODPECKER_SUBDOMAIN:-woodpecker}.${DOMAIN_NAME:-dss.localhost}`)"
      - "traefik.http.routers.woodpecker.entrypoints=websecure"
      - "traefik.http.routers.woodpecker.tls=true"
      - "traefik.http.services.woodpecker.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/healthz || wget -q --spider http://127.0.0.1:8000/ || exit\
            \ 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: woodpecker-socket-proxy
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${WOODPECKER_SOCKET_PROXY_CPUS_LIMIT:-0.25}"
          memory: "${WOODPECKER_SOCKET_PROXY_MEMORY_LIMIT:-128M}"
        reservations:
          cpus: "${WOODPECKER_SOCKET_PROXY_CPUS_RESERVED:-0.05}"
          memory: "${WOODPECKER_SOCKET_PROXY_MEMORY_RESERVED:-32M}"
    environment:
      # INFO is denied by default; the agent calls Docker Info before it can run.
      - INFO=1
      - CONTAINERS=1
      - POST=1
      - EXEC=0
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - woodpecker_docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3.19.0
    container_name: woodpecker-agent
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${WOODPECKER_AGENT_CPUS_LIMIT:-1}"
          memory: "${WOODPECKER_AGENT_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${WOODPECKER_AGENT_CPUS_RESERVED:-0.5}"
          memory: "${WOODPECKER_AGENT_MEMORY_RESERVED:-512M}"
    depends_on:
      woodpecker-server:
        condition: service_healthy
      socket-proxy:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:?Set WOODPECKER_AGENT_SECRET in woodpecker/.env (openssl rand -hex
        32)}
      - WOODPECKER_MAX_WORKFLOWS=${WOODPECKER_MAX_WORKFLOWS:-2}
      - WOODPECKER_BACKEND_DOCKER=true
      - DOCKER_HOST=tcp://socket-proxy:2375
    networks:
      - backend_net
      - woodpecker_docker
    # `ping` hits the agent's :3000/healthz, which stops while the server is unreachable.
    healthcheck:
      test: ["CMD", "/bin/woodpecker-agent", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  woodpecker_data:
    name: woodpecker_data

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
  # Only the agent may reach the socket proxy. Do not attach this network elsewhere.
  woodpecker_docker:
    name: woodpecker_docker
    internal: true
