services:
  hindsight:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_shared"
      - "traefik.http.routers.hindsight.rule=Host(`${HINDSIGHT_HOSTNAME:-hindsight.dss.localhost}`)"
      - "traefik.http.routers.hindsight.entrypoints=web,websecure"
      - "traefik.http.routers.hindsight.tls=true"
      - "traefik.http.routers.hindsight.service=hindsight"
      - "traefik.http.services.hindsight.loadbalancer.server.port=8888"
      - "traefik.http.routers.hindsight-ui.rule=Host(`${HINDSIGHT_UI_HOSTNAME:-hindsight-ui.dss.localhost}`)"
      - "traefik.http.routers.hindsight-ui.entrypoints=web,websecure"
      - "traefik.http.routers.hindsight-ui.tls=true"
      - "traefik.http.routers.hindsight-ui.service=hindsight-ui"
      - "traefik.http.services.hindsight-ui.loadbalancer.server.port=9999"
    container_name: hindsight
    # Slim image: no local embedder/reranker (~300–500 MB idle). Pair with remote providers.
    # Full image alternative: ghcr.io/vectorize-io/hindsight:0.10.2 (~2 GB recommended).
    image: ghcr.io/vectorize-io/hindsight:0.10.2-slim
    restart: "${RESTART_POLICY:-unless-stopped}"
    shm_size: "${HINDSIGHT_SHM_SIZE:-256m}"
    deploy:
      resources:
        limits:
          cpus: "${HINDSIGHT_CPUS_LIMIT:-1}"
          memory: "${HINDSIGHT_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${HINDSIGHT_CPUS_RESERVED:-0.25}"
          memory: "${HINDSIGHT_MEMORY_RESERVED:-256M}"
    # Traefik-only access — no host port publish (see plan: omit ports:).
    environment:
      HINDSIGHT_API_DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-Password102!}@${POSTGRES_HOST:-pgvector}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-hindsight}"
      # Chat via openai-quota-gateway (OpenAI-compatible /v1/chat/completions).
      HINDSIGHT_API_LLM_PROVIDER: "${HINDSIGHT_API_LLM_PROVIDER:-openai}"
      HINDSIGHT_API_LLM_API_KEY: "${HINDSIGHT_API_LLM_API_KEY:-}"
      HINDSIGHT_API_LLM_MODEL: "${HINDSIGHT_API_LLM_MODEL:-gemma-4-26b-a4b-it}"
      HINDSIGHT_API_LLM_BASE_URL: "${HINDSIGHT_API_LLM_BASE_URL:-http://openai-quota-gateway:8000/v1}"
      # Must be valid JSON or omitted — empty string crashes config parse.
      HINDSIGHT_API_LLM_DEFAULT_HEADERS: "${HINDSIGHT_API_LLM_DEFAULT_HEADERS:-null}"
      # Embeddings via gateway (LiteLLM SDK). Gemini requires encoding_format=float.
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: "${HINDSIGHT_API_EMBEDDINGS_PROVIDER:-litellm-sdk}"
      HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_API_KEY: "${HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_API_KEY:-}"
      HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_MODEL: "${HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_MODEL:-openai/gemini-embedding-2}"
      HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_API_BASE: "${HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_API_BASE:-http://openai-quota-gateway:8000/v1}"
      HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_ENCODING_FORMAT: "${HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_ENCODING_FORMAT:-float}"
      HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_OUTPUT_DIMENSIONS: "${HINDSIGHT_API_EMBEDDINGS_LITELLM_SDK_OUTPUT_DIMENSIONS:-1536}"
      # Rerank via gateway Cohere-compatible /v1/rerank (LiteLLM client).
      HINDSIGHT_API_RERANKER_PROVIDER: "${HINDSIGHT_API_RERANKER_PROVIDER:-litellm}"
      HINDSIGHT_API_RERANKER_LITELLM_API_BASE: "${HINDSIGHT_API_RERANKER_LITELLM_API_BASE:-http://openai-quota-gateway:8000/v1}"
      HINDSIGHT_API_RERANKER_LITELLM_API_KEY: "${HINDSIGHT_API_RERANKER_LITELLM_API_KEY:-}"
      HINDSIGHT_API_RERANKER_LITELLM_MODEL: "${HINDSIGHT_API_RERANKER_LITELLM_MODEL:-semantic-ranker-fast-004}"
      HINDSIGHT_API_WORKER_ID: "${HINDSIGHT_API_WORKER_ID:-hindsight-dss}"
      HINDSIGHT_CP_DATAPLANE_API_URL: "${HINDSIGHT_CP_DATAPLANE_API_URL:-http://127.0.0.1:8888}"
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      # /health/ready verifies PostgreSQL connectivity (alias: /health).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health/ready',\
            \ timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
