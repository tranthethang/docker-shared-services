services:
  inngest:
    container_name: inngest
    # Pin version for reproducibility (was :latest). Matches previously running OCI label 1.45.1.
    image: inngest/inngest:v1.45.1
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${INNGEST_CPUS_LIMIT:-0.5}"
          memory: "${INNGEST_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${INNGEST_CPUS_RESERVED:-0.1}"
          memory: "${INNGEST_MEMORY_RESERVED:-128M}"
    # Leave INNGEST_SDK_URL empty. Apps register themselves (SDK PUT).
    # A default http://api:8000 URL stays "unreachable" when that host is absent.
    command:
      - bash
      - -c
      - |
        args=(start --host 0.0.0.0 --port 8288)
        if [ -n "$${INNGEST_SDK_URL}" ]; then
          args+=(--sdk-url "$${INNGEST_SDK_URL}")
        fi
        exec inngest "$${args[@]}"
    environment:
      - INNGEST_SDK_URL=${INNGEST_SDK_URL:-}
      - INNGEST_PORT=8288
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY:?Set INNGEST_EVENT_KEY in .env — run make setup}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY:?Set INNGEST_SIGNING_KEY in .env — run make setup}
      - INNGEST_POSTGRES_URL=postgres://${POSTGRES16_USER:-postgres}:${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env
        — run make setup}@${POSTGRES16_HOST:-postgres}:5432/${POSTGRES16_DB:-inngest}?sslmode=disable
      - INNGEST_POSTGRES_URI=postgres://${POSTGRES16_USER:-postgres}:${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env
        — run make setup}@${POSTGRES16_HOST:-postgres}:5432/${POSTGRES16_DB:-inngest}?sslmode=disable
      - INNGEST_REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — run make setup}@${REDIS_HOST:-redis}:6379
      - INNGEST_REDIS_URI=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — run make setup}@${REDIS_HOST:-redis}:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env — run make setup}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=6379
      - POSTGRES_USER=${POSTGRES16_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES16_PASSWORD:?Set POSTGRES16_PASSWORD in .env — run make setup}
      - POSTGRES_HOST=${POSTGRES16_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES16_DB:-inngest}
    networks:
      - traefik_proxy
      - backend_net
      - data_net
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8288 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\\
            r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.inngest.rule=Host(`inngest.dss.localhost`)"
      - "traefik.http.routers.inngest.entrypoints=websecure"
      - "traefik.http.routers.inngest.tls=true"
      - "traefik.http.services.inngest.loadbalancer.server.port=8288"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  data_net:
    external: true
  traefik_proxy:
    external: true
  backend_net:
    external: true
