services:
  inngest:
    container_name: inngest
    image: inngest/inngest:latest
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${INNGEST_CPUS_LIMIT:-0.5}"
          memory: "${INNGEST_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${INNGEST_CPUS_RESERVED:-0.1}"
          memory: "${INNGEST_MEMORY_RESERVED:-128M}"
    command: >
      inngest start --host 0.0.0.0 --port 8288 
      --event-key ${INNGEST_EVENT_KEY} 
      --signing-key ${INNGEST_SIGNING_KEY} 
      --postgres-uri postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password102}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-inngest}?sslmode=disable 
      --redis-uri redis://:${REDIS_PASSWORD:-password102}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379} 
      --sdk-url ${INNGEST_SDK_URL:-http://api:8000/api/inngest}
    ports:
      - "${INNGEST_PORT:-8288}:8288"
    environment:
      - INNGEST_PORT=8288
      - INNGEST_EVENT_KEY=${INNGEST_EVENT_KEY}
      - INNGEST_SIGNING_KEY=${INNGEST_SIGNING_KEY}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-password102}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password102}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-inngest}
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8288 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_shared"
      - "traefik.http.routers.inngest.rule=Host(`inngest.localhost`)"
      - "traefik.http.routers.inngest.entrypoints=web,websecure"
      - "traefik.http.routers.inngest.tls=true"
      - "traefik.http.services.inngest.loadbalancer.server.port=8288"

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
