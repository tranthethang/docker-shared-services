services:
  memcached:
    container_name: memcached
    image: memcached:1.6.39-alpine
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${MEMCACHED_CPUS_LIMIT:-0.5}"
          memory: "${MEMCACHED_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${MEMCACHED_CPUS_RESERVED:-0.25}"
          memory: "${MEMCACHED_MEMORY_RESERVED:-256M}"
    ports:
      - "127.0.0.1:${MEMCACHED_PORT:-11211}:11211"
    networks:
      - data_net
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "memcached-tool", "localhost", "stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  data_net:
    external: true
