services:
  memcached:
    container_name: memcached
    image: memcached:1.6.39-alpine
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${MEMCACHED_CPUS_LIMIT:-0.5}"
          memory: "${MEMCACHED_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${MEMCACHED_CPUS_RESERVED:-0.25}"
          memory: "${MEMCACHED_MEMORY_RESERVED:-256M}"
    ports:
      - "${MEMCACHED_PORT:-11211}:11211"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "memcached-tool", "localhost", "stats"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
