services:
  portainer:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.dss.localhost`)"
      - "traefik.http.routers.portainer.entrypoints=web,websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    container_name: portainer
    image: portainer/portainer-ce:2.33.6
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${PORTAINER_CPUS_LIMIT:-0.5}"
          memory: "${PORTAINER_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${PORTAINER_CPUS_RESERVED:-0.25}"
          memory: "${PORTAINER_MEMORY_RESERVED:-256M}"
    ports:
      - "127.0.0.1:${PORTAINER_HTTP_PORT:-9007}:9000"
      - "127.0.0.1:${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      # RW required for Portainer management API (SEC-01 intentionally not :ro).
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - infra_shared
      - dev_tools
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/api/system/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  portainer_data:
