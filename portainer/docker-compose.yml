services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:2.33.6
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${PORTAINER_CPUS_LIMIT:-0.5}"
          memory: "${PORTAINER_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${PORTAINER_CPUS_RESERVED:-0.25}"
          memory: "${PORTAINER_MEMORY_RESERVED:-256M}"
    ports:
      - "${PORTAINER_HTTP_PORT:-9007}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - infra_shared
      - dev_tools

networks:
volumes:
  portainer_data:
