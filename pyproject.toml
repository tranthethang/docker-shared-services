[project]
name = "docker-shared-services"
version = "0.1.0"
description = "Docker Compose shared services — local tooling (format, etc.)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=1.13.0",
    "pathspec>=1.1.1",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.1",
    "shellcheck-py>=0.10.0",
    "shfmt-py>=3.8.0",
    "yamlfix>=1.19.1",
]
tui = [
    "docker>=7.1.0",
    "textual>=2.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "**/data",
    "**/volumes",
    "tests/golden",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Existing long lines. The file-size baseline owns these modules until P2 splits them.
"bin/env_manager.py" = ["E501"]
"bin/package_export.py" = ["E501"]

[tool.yamlfix]
explicit_start = false
preserve_quotes = true
sequence_style = "keep_style"
line_length = 120
whitelines = 1
section_whitelines = 1
indent_mapping = 2
indent_offset = 2
indent_sequence = 4
comments_whitelines = 1

[tool.mdformat]
wrap = "keep"
number = false
end_of_line = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["bin", "scripts"]
warn_unused_configs = true
# Non-strict baseline. Per-module ignore_errors stays until P3 removes it.

[[tool.mypy.overrides]]
module = [
  "bin.env_manager",
  "bin.package_export",
  "bin.package_wizard",
  "bin.service_catalog",
  "bin.service_manager",
  "bin.tui",
  "bin.tui.__main__",
  "bin.tui.app",
  "bin.tui.compose_ops",
  "bin.tui.docker_state",
  "bin.tui.ops_mixin",
  "bin.tui.screens",
  "format_repo",
]
ignore_errors = true
