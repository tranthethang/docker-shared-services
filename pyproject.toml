[project]
name = "docker-shared-services"
version = "0.1.0"
description = "Docker Compose shared services — local tooling (format, etc.)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "pathspec>=1.1.1",
    "ruff>=0.16.1",
    "yamlfix>=1.19.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "**/data",
    "**/volumes",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.yamlfix]
explicit_start = false
preserve_quotes = true
sequence_style = "keep_style"
line_length = 120
whitelines = 1
section_whitelines = 1
indent_mapping = 2
indent_offset = 2
indent_sequence = 4
comments_whitelines = 1

[tool.mdformat]
wrap = "keep"
number = false
end_of_line = "lf"
