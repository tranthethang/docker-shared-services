[project]
name = "docker-shared-services"
version = "0.1.0"
description = "Docker Compose shared services — local tooling (format, etc.)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "import-linter>=2.1.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mypy>=1.13.0",
    "pathspec>=1.1.1",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.1",
    "shellcheck-py>=0.10.0",
    "shfmt-py>=3.8.0",
    "yamlfix>=1.19.1",
]
tui = [
    "docker>=7.1.0",
    "textual>=2.1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "**/data",
    "**/volumes",
    "tests/golden",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# Existing long lines. The file-size baseline owns these modules until P2 splits them.
"dss/core/env_manager.py" = ["E501"]
"dss/package/export.py" = ["E501"]

[tool.yamlfix]
explicit_start = false
preserve_quotes = true
sequence_style = "keep_style"
line_length = 120
whitelines = 1
section_whitelines = 1
indent_mapping = 2
indent_offset = 2
indent_sequence = 4
comments_whitelines = 1

[tool.mdformat]
wrap = "keep"
number = false
end_of_line = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run from the repo root so `dss` imports without an installed package.
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["dss", "tools"]
warn_unused_configs = true
# Non-strict baseline. Per-module ignore_errors stays until P3 removes it.

[[tool.mypy.overrides]]
module = [
  "dss.cli.service",
  "dss.core.env_manager",
  "dss.core.service_catalog",
  "dss.package.export",
  "dss.package.wizard",
  "dss.tui",
  "dss.tui.__main__",
  "dss.tui.app",
  "dss.tui.compose_ops",
  "dss.tui.docker_state",
  "dss.tui.ops_mixin",
  "dss.tui.screens",
  "format_repo",
]
ignore_errors = true

[tool.importlinter]
root_package = "dss"

[[tool.importlinter.contracts]]
name = "core imports no higher layer"
type = "forbidden"
source_modules = ["dss.core"]
forbidden_modules = ["dss.cli", "dss.package", "dss.tui"]

[[tool.importlinter.contracts]]
name = "cli and package do not import tui"
type = "forbidden"
source_modules = ["dss.cli", "dss.package"]
forbidden_modules = ["dss.tui"]

[[tool.importlinter.contracts]]
name = "cli and package are independent"
type = "independence"
modules = ["dss.cli", "dss.package"]
