services:
  traefik:
    image: "traefik:v2.10.7"
    container_name: "traefik"
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS_LIMIT:-1}"
          memory: "${TRAEFIK_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${TRAEFIK_CPUS_RESERVED:-0.5}"
          memory: "${TRAEFIK_MEMORY_RESERVED:-256M}"
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--api.entrypoint=internal"
      - "--entrypoints.internal.address=:8080"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file=true"
      - "--providers.file.filename=/traefik/config.yml"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/traefik/acme.json"
      - "--log.level=${LOG_LEVEL:-INFO}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "./config.yml:/traefik/config.yml:ro"
      - "./acme.json:/traefik/acme.json"
    restart: "${RESTART_POLICY:-always}"
    networks:
      - dev_tools

networks:
  dev_tools:
    name: dev_tools
    driver: bridge
