services:
  traefik:
    image: "traefik:v3.7"
    container_name: "traefik"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.dss.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:?Set TRAEFIK_DASHBOARD_AUTH in .env\
        \ (run make setup)}"
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS_LIMIT:-1}"
          memory: "${TRAEFIK_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${TRAEFIK_CPUS_RESERVED:-0.5}"
          memory: "${TRAEFIK_MEMORY_RESERVED:-256M}"
    command:
      - "--api.dashboard=true"
      - "--ping=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
      - "--entryPoints.websecure.address=:443"
      - "--providers.file=true"
      - "--providers.file.filename=/traefik/config.yml"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://traefik-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik_proxy"
      - "--providers.docker.defaultRule=Host(`{{ normalize .Name }}.dss.localhost`)"
      - "--log.level=${LOG_LEVEL:-INFO}"
    ports:
      # Loopback-only: *.dss.localhost and local tools still work; LAN exposure is blocked (SEC-02/SEC-05).
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./config.yml:/traefik/config.yml:ro
      - ./certs:/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "${RESTART_POLICY:-unless-stopped}"
    depends_on:
      socket-proxy:
        condition: service_healthy
    networks:
      traefik_proxy:
        aliases:
          - minio.dss.localhost
          - s3.minio.dss.localhost
      traefik_docker:

  # Read-only Docker API for the provider. A :ro socket mount does not limit the API.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: traefik-socket-proxy
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_SOCKET_PROXY_CPUS_LIMIT:-0.1}"
          memory: "${TRAEFIK_SOCKET_PROXY_MEMORY_LIMIT:-64M}"
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik_docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  # Only Traefik may reach its socket proxy. Do not attach this network elsewhere.
  traefik_docker:
    name: traefik_docker
    internal: true
