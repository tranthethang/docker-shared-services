services:
  traefik:
    image: "traefik:v2.11.31"
    container_name: "traefik"
    deploy:
      resources:
        limits:
          cpus: "${TRAEFIK_CPUS_LIMIT:-1}"
          memory: "${TRAEFIK_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${TRAEFIK_CPUS_RESERVED:-0.5}"
          memory: "${TRAEFIK_MEMORY_RESERVED:-256M}"
    command:
      # Dashboard/API stay available for local DX but are only published on loopback (see ports).
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.file=true"
      - "--providers.file.filename=/traefik/config.yml"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=infra_shared"
      - "--log.level=${LOG_LEVEL:-INFO}"
    ports:
      # Loopback-only: *.dss.localhost and local tools still work; LAN exposure is blocked (SEC-02/SEC-05).
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config.yml:/traefik/config.yml:ro
      - ./certs:/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: "${RESTART_POLICY:-unless-stopped}"
    networks:
      infra_shared:
        aliases:
          - minio.dss.localhost
          - s3.minio.dss.localhost

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
