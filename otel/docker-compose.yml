services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: otel-collector
    command: ["--config=/etc/otel-config.yaml"]
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: ${OTEL_COLLECTOR_CPU_LIMIT:-0.25}
          memory: ${OTEL_COLLECTOR_MEM_LIMIT:-512M}
    ports:
      - "127.0.0.1:${OTEL_COLLECTOR_PORT_GRPC:-4317}:4317" # OTLP gRPC
      - "127.0.0.1:${OTEL_COLLECTOR_PORT_HTTP:-4318}:4318" # OTLP HTTP
    networks:
      - backend_net
      - data_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOSTNAME:-grafana.dss.localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    container_name: grafana
    image: grafana/grafana-oss:${GRAFANA_VERSION:-11.4.0}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env — run make setup}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    networks:
      - traefik_proxy
      - backend_net
      - data_net
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPUS_LIMIT:-0.50}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${GRAFANA_CPUS_RESERVED:-0.10}"
          memory: ${GRAFANA_MEMORY_RESERVED:-128M}
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    container_name: loki
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - data_net
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPUS_LIMIT:-0.50}"
          memory: ${LOKI_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    container_name: alloy
    image: grafana/alloy:${ALLOY_VERSION:-v1.20.1}
    restart: ${RESTART_POLICY:-unless-stopped}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - backend_net
      - otel_docker
      - data_net
    volumes:
      - ./config/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    deploy:
      resources:
        limits:
          cpus: "${ALLOY_CPUS_LIMIT:-0.2}"
          memory: ${ALLOY_MEMORY_LIMIT:-128M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      loki:
        condition: service_healthy
      alloy-socket-proxy:
        condition: service_healthy
    # grafana/alloy:v1.20.1 is root with perl, and has neither wget nor curl.
    healthcheck:
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr => \"127.0.0.1:12345\",\
            \ Timeout => 2) or exit 1; print $$s \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\"; my $$l = <$$s>; exit($$l =~ /200/\
            \ ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Read-only Docker API for log discovery. Alloy also lists /networks.
  alloy-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: alloy-socket-proxy
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${ALLOY_SOCKET_PROXY_CPUS_LIMIT:-0.1}"
          memory: "${ALLOY_SOCKET_PROXY_MEMORY_LIMIT:-64M}"
    environment:
      - CONTAINERS=1
      - NETWORKS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - otel_docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector-probe:
    container_name: otel-collector-probe
    image: curlimages/curl:8.22.0
    entrypoint: ["sleep", "infinity"]
    network_mode: "service:otel-collector"
    restart: "${RESTART_POLICY:-unless-stopped}"
    # restart: true makes `docker compose restart` restart the probe after otel-collector;
    # otherwise it races the shared network namespace and stays exited.
    depends_on:
      otel-collector:
        condition: service_started
        restart: true
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:13133/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
  data_net:
    external: true
  # Only Alloy may reach its socket proxy. Do not attach this network elsewhere.
  otel_docker:
    name: otel_docker
    internal: true

volumes:
  grafana_data:
  loki_data:
  alloy_data:
