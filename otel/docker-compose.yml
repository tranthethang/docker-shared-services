services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    container_name: otel-collector
    command: ["--config=/etc/otel-config.yaml"]
    restart: ${RESTART_POLICY:-always}
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./otel-config.yaml:/etc/otel-config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: ${OTEL_COLLECTOR_CPU_LIMIT:-0.25}
          memory: ${OTEL_COLLECTOR_MEM_LIMIT:-512M}
    ports:
      - "${OTEL_COLLECTOR_PORT_GRPC:-4317}:4317" # OTLP gRPC
      - "${OTEL_COLLECTOR_PORT_HTTP:-4318}:4318" # OTLP HTTP
    networks:
      - infra_shared
      - dev_tools
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`${GRAFANA_HOSTNAME:-grafana.dss.localhost}`)"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    container_name: grafana
    image: grafana/grafana-oss:${GRAFANA_VERSION:-11.4.0}
    restart: ${RESTART_POLICY:-always}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-Password102!}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPUS_LIMIT:-0.50}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
        reservations:
          cpus: "${GRAFANA_CPUS_RESERVED:-0.10}"
          memory: ${GRAFANA_MEMORY_RESERVED:-128M}
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    container_name: loki
    image: grafana/loki:${LOKI_VERSION:-3.3.2}
    restart: ${RESTART_POLICY:-always}
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          cpus: "${LOKI_CPUS_LIMIT:-0.50}"
          memory: ${LOKI_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  promtail:
    container_name: promtail
    image: grafana/promtail:${PROMTAIL_VERSION:-3.3.2}
    restart: ${RESTART_POLICY:-always}
    command: -config.file=/etc/promtail/config.yml
    networks:
      - infra_shared
      - dev_tools
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "${PROMTAIL_CPUS_LIMIT:-0.20}"
          memory: ${PROMTAIL_MEMORY_LIMIT:-256M}
    depends_on:
      loki:
        condition: service_healthy

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true

volumes:
  grafana_data:
  loki_data:
