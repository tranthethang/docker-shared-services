services:
  minio:
    container_name: minio
    image: minio/minio:latest
    restart: "${RESTART_POLICY:-always}"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS_LIMIT:-1}"
          memory: "${MINIO_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MINIO_CPUS_RESERVED:-0.5}"
          memory: "${MINIO_MEMORY_RESERVED:-512M}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password102}
      - MINIO_BROWSER=${MINIO_BROWSER:-on}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-https://minio.localhost}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL:-https://s3.minio.localhost}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    networks:
      - dev_tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  dev_tools:
    name: dev_tools
    external: true

volumes:
  minio_data:
