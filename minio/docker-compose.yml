services:
  minio:
    container_name: minio
    image: bitnami/minio:2024.11.15
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS_LIMIT:-1}"
          memory: "${MINIO_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MINIO_CPUS_RESERVED:-0.5}"
          memory: "${MINIO_MEMORY_RESERVED:-512M}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password102}
      - MINIO_DEFAULT_BUCKETS=${MINIO_DEFAULT_BUCKETS:-my-bucket}
      - MINIO_BROWSER=${MINIO_BROWSER:-on}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - dev_tools
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  dev_tools:
    name: dev_tools
    external: true

volumes:
  minio_data:
