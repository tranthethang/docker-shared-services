services:
  minio:
    container_name: minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "${RESTART_POLICY:-unless-stopped}"
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          cpus: "${MINIO_CPUS_LIMIT:-1}"
          memory: "${MINIO_MEMORY_LIMIT:-1G}"
        reservations:
          cpus: "${MINIO_CPUS_RESERVED:-0.5}"
          memory: "${MINIO_MEMORY_RESERVED:-512M}"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env — run make setup}
      - MINIO_BROWSER=${MINIO_BROWSER:-on}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_BROWSER_REDIRECT_URL:-https://minio.dss.localhost}
      - MINIO_SERVER_URL=${MINIO_SERVER_URL:-http://minio:9000}
      - MINIO_BROWSER_TLS_SKIP_VERIFY=on
    ports:
      - "127.0.0.1:${MINIO_PORT:-9002}:9000"
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.minio.rule=Host(`minio.dss.localhost`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio-s3.rule=Host(`s3.minio.dss.localhost`)"
      - "traefik.http.routers.minio-s3.entrypoints=websecure"
      - "traefik.http.routers.minio-s3.tls=true"
      - "traefik.http.routers.minio-s3.service=minio-s3"
      - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"
    networks:
      - traefik_proxy
      - backend_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true

volumes:
  minio_data:
