services:
  node-red:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.node-red.rule=Host(`node-red.dss.localhost`)"
      - "traefik.http.routers.node-red.entrypoints=websecure"
      - "traefik.http.routers.node-red.tls=true"
      - "traefik.http.services.node-red.loadbalancer.server.port=1880"
    container_name: node-red
    image: nodered/node-red:4.0.9
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${NODE_RED_CPUS_LIMIT:-0.5}"
          memory: "${NODE_RED_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${NODE_RED_CPUS_RESERVED:-0.1}"
          memory: "${NODE_RED_MEMORY_RESERVED:-128M}"
    environment:
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - node_red_data:/data
    networks:
      - traefik_proxy
      - backend_net
      - data_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:1880/', (res) => { if (res.statusCode >= 200 && res.statusCode\
            \ < 400) { process.exit(0); } else { process.exit(1); } }).on('error', (e) => { process.exit(1); })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_proxy:
    external: true
  backend_net:
    external: true
  data_net:
    external: true

volumes:
  node_red_data:
