services:
  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    restart: "${RESTART_POLICY:-always}"
    deploy:
      resources:
        limits:
          cpus: "${DOZZLE_CPUS_LIMIT:-0.5}"
          memory: "${DOZZLE_MEMORY_LIMIT:-512M}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    networks:
      - infra_shared
      - dev_tools

networks:
