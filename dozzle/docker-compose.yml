services:
  dozzle:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.dss.localhost`)"
      - "traefik.http.routers.dozzle.entrypoints=web,websecure"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    container_name: dozzle
    image: amir20/dozzle:v10.6
    restart: "${RESTART_POLICY:-unless-stopped}"
    deploy:
      resources:
        limits:
          cpus: "${DOZZLE_CPUS_LIMIT:-0.5}"
          memory: "${DOZZLE_MEMORY_LIMIT:-512M}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    environment:
      DOZZLE_AUTH_PROVIDER: "${DOZZLE_AUTH_PROVIDER:-simple}"
      DOZZLE_AUTH_TTL: "${DOZZLE_AUTH_TTL:-48h}"
    networks:
      - infra_shared
      - dev_tools
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  infra_shared:
    external: true
  dev_tools:
    external: true
